[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopulse"
version = "0.1.0"
description = "A source-grounded daily geopolitical briefing bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27.0,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
database = ["supabase>=2.10,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
geopulse = "geopulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
